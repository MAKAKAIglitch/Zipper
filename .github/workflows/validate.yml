name: Validate Zipper source

on:
  push:
    paths:
      - 'Zipper.ps1'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'Zipper.ps1'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Parse PowerShell source
        shell: powershell
        run: |
          $source = Get-Content -LiteralPath 'Zipper.ps1' -Raw -Encoding UTF8
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'PowerShell syntax is valid.'

      - name: Compile embedded C# engine
        shell: powershell
        run: |
          $source = Get-Content -LiteralPath 'Zipper.ps1' -Raw -Encoding UTF8
          if ($source -match '(?s)\$cs\s*=\s*@''(.*?)''@') {
            $engineSource = $Matches[1]
          } else {
            throw 'Could not locate the embedded C# engine.'
          }
          Add-Type -TypeDefinition $engineSource -Language CSharp -ReferencedAssemblies 'System.Windows.Forms', 'System.Drawing', 'System.Core'
          Write-Host 'Embedded C# engine compiles successfully.'
